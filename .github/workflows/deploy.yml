name: Deploy Python & Gen AI Platform to Server VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Server VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            echo "🚀 Starting automated deployment..."

            PROJECT_DIR="/home/ubuntu/python-bootcamp"
            WEB_ROOT="/var/www/python-bootcamp"

            # Auto-create directories & clone repo if missing on VM
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "📁 Project directory not found on VM. Auto-cloning repository..."
              cd /home/ubuntu
              git clone https://github.com/Utkarsh6629/GenAI-Python-basics.git python-bootcamp
            fi

            sudo mkdir -p "$WEB_ROOT"
            sudo chown -R ubuntu:ubuntu "$WEB_ROOT" || true

            cd "$PROJECT_DIR"

            echo "📥 Pulling latest code from GitHub main..."
            git fetch origin main
            git reset --hard origin/main

            # ── 1. Frontend Build & Deploy ────────────────────────────────────
            echo "📦 Building React Frontend..."
            cd client
            npm install --include=dev
            npm run build

            echo "📂 Copying static bundle to $WEB_ROOT..."
            sudo cp -r dist/* "$WEB_ROOT/"
            cd ..

            # ── 2. Backend API Deploy via PM2 ─────────────────────────────────
            echo "⚙️ Deploying Node.js Backend API..."
            cd server
            npm install --include=dev
            
            PM2_APP_NAME="python-bootcamp-api"
            if command -v pm2 &> /dev/null; then
              pm2 restart "$PM2_APP_NAME" || pm2 start index.js --name "$PM2_APP_NAME" --env production
              pm2 save
            else
              echo "ℹ️ PM2 not installed globally yet. Execute setup-deployment.sh on VM to configure PM2."
            fi
            cd ..

            # ── 3. Reload Nginx ───────────────────────────────────────────────
            if command -v nginx &> /dev/null; then
              echo "🔄 Reloading Nginx..."
              sudo systemctl reload nginx || true
            else
              echo "ℹ️ Nginx not installed yet. Execute setup-deployment.sh on VM to configure Nginx & SSL."
            fi

            echo "✅ Deployment complete! Website code updated successfully."
